name: Probar ElCinema sin publicar

on:
  pull_request:
    paths:
      - "custom/elcinema-*.cjs"
      - "custom/elcinema-todos.channels.xml"
      - "custom/elcinema-objetivos.txt"
      - ".github/workflows/probar-elcinema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Etc/GMT-6
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Dependencias compatibles con la compilación
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git upstream-epg
          cd upstream-epg
          npm ci
      - name: Preparar extractores
        run: cp custom/elcinema-* upstream-epg/
      - name: Comprobar sintaxis JavaScript
        run: |
          node --check upstream-epg/elcinema-grabber.cjs
          node --check upstream-epg/elcinema-mbc-rotana.cjs
          node --check upstream-epg/elcinema-otros-ar.cjs
          node --check upstream-epg/elcinema-test.cjs
      - name: Extraer guía actual desde ElCinema
        working-directory: upstream-epg
        run: |
          node elcinema-mbc-rotana.cjs
          node elcinema-otros-ar.cjs
      - name: Listar programas MBC 5
        working-directory: upstream-epg
        run: |
          node -e "const rows=require('./elcinema-mbc-rotana.json').filter(p=>p.id==='MBC5.ae'); rows.sort((a,b)=>a.inicio.localeCompare(b.inicio)); for(const p of rows) console.log(p.inicio+' | '+p.titulo); console.log('TOTAL MBC 5: '+rows.length)"
      - name: Verificar horarios y 31 canales sin desplazamientos
        working-directory: upstream-epg
        run: node elcinema-test.cjs
      - name: Exportar programas MBC 5 para comparacion local
        working-directory: upstream-epg
        run: |
          node -e "const fs=require('fs'); const data=require('./elcinema-mbc-rotana.json').filter(p=>p.id==='MBC5.ae'); fs.writeFileSync('mbc5-github.json',JSON.stringify(data,null,2),'utf8')"
      - name: Guardar JSON MBC 5
        uses: actions/upload-artifact@v4
        with:
          name: mbc5-github
          path: upstream-epg/mbc5-github.json
          retention-days: 7
